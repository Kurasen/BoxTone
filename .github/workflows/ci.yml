name: CI

# 不依赖 DevEco / HarmonyOS SDK 的检查：
#  - 离线逻辑自检（协议编解码、音效包、规格常量、设置读取）
#  - release 混淆规则与 native 名字一致性（只查源码和规则文件，不构建）
#  - 敏感信息扫描（私钥、签名材料、Token 误提交）
# 需要 SDK 的 assembleHap 不在这里跑：闭源 @kit.UIDesignKit 只随 DevEco 分发。

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
  pull_request:
  workflow_dispatch:

jobs:
  offline-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify logic (no device, no SDK)
        shell: pwsh
        run: node tools/verify-logic.mjs

      # 只看源码 import 与 obfuscation-rules.txt 的 keep 名单，不构建、不需要 SDK。
      # 原生接口加了名字却忘写规则时，这里会直接失败，不必等打到 release 包才发现。
      - name: Check release obfuscation keep-list
        shell: bash
        run: bash tools/check-release.sh static

      # 扫描全部已跟踪文件：CI 检出的是干净工作区，暂存区永远为空，
      # 只扫暂存区（旧写法 git add -A 后再扫）会直接 exit 0，等于没检查。
      - name: Scan tracked files for secrets
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/check-sensitive-staged.ps1 -All